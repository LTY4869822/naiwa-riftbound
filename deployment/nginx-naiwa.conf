# Include these locations inside your existing HTTPS server.
# Put the game in /srv/naiwa. Do not replace the whole nginx.conf.
root /srv/naiwa;
index index.html;

location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}

location ~ ^/assets/naiwa\..*\.gz$ {
    try_files $uri =404;
    default_type application/octet-stream;
    gzip off;
    gzip_static off;
    # These are compressed data containers, not HTTP gzip representations.
    # Do NOT add Content-Encoding: gzip here.
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~ \.woff2$ {
    try_files $uri =404;
    types { font/woff2 woff2; }
    add_header Cache-Control "public, max-age=86400";
}
