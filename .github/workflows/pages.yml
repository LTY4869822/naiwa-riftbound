name: Deploy browser game
"on":
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://lty4869822.github.io/naiwa-riftbound/
    steps:
      - uses: actions/checkout@v4
      - name: Verify distributable files
        run: python3 tools/check_publication.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
      - uses: actions/deploy-pages@v4
